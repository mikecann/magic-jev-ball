<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magic Jev Ball</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0b12;
    --fg: #f2f2f7;
    --muted: #8a8aa0;
    --panel: #15151f;
    --line: #262636;
    --accent: #5b6cff;
    --doodle: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body > * { flex-shrink: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% 35%, #1b1b33 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
    padding: 64px 16px 24px; overflow-x: hidden;
  }
  h1 { font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; font-size: clamp(28px, 5vw, 44px); }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }

  form { display: flex; width: min(640px, 100%); }
  input {
    flex: 1; font: inherit; font-size: 18px; color: var(--fg);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; outline: none;
  }
  input:focus { border-color: var(--accent); }

  .stage { position: relative; width: min(900px, 100%); height: 460px; margin: 8px 0 4px; }
  .stage { touch-action: none; }
  canvas.gl { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 5; }

  /* Hand-drawn "shake me" hint. Shown once, after the first question is typed. */
  .doodle {
    position: absolute; top: 18px; left: calc(50% + 120px); width: 210px; pointer-events: none;
    color: var(--doodle); opacity: 0; transform: rotate(-4deg); transition: opacity .3s;
  }
  .doodle.on { opacity: 1; }
  .doodle .label { font-family: Caveat, cursive; font-size: 34px; line-height: 1; margin-left: 58px; }
  .doodle svg { display: block; overflow: visible; }
  .doodle path { fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 400; stroke-dashoffset: 400; }
  .doodle.on path { animation: draw .7s ease-out forwards; }
  .doodle.on path.head { animation-delay: .6s; animation-duration: .25s; }
  .doodle.on .wiggle { animation: wiggle 1.6s ease-in-out 1s infinite; transform-origin: 20% 90%; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  @keyframes wiggle { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-6px,4px) } }

  .status { height: 34px; display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 14px; }
  .status .msg { color: var(--muted); font-size: 14px; transition: color .2s; }
  .status .msg.go { color: #5dea9a; font-weight: 600; }
  .status .msg.warn { color: #ffb86b; }
  .meter { width: 180px; height: 6px; border-radius: 4px; background: #20202e; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .meter.on { opacity: 1; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5b6cff, #5dea9a); }

  .panel {
    width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px 20px; font-family: "JetBrains Mono", monospace; font-size: 13px;
    min-height: 196px; opacity: 0; transform: translateY(8px); transition: opacity .4s, transform .4s;
  }
  .panel.on { opacity: 1; transform: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); margin-bottom: 14px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .meta .fast { color: #5dea9a; }
  .row { display: grid; grid-template-columns: 200px 1fr 48px; align-items: center; gap: 12px; margin: 7px 0; }
  .row .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .row.top .lbl { color: var(--fg); font-weight: 600; }
  .bar { height: 10px; background: #20202e; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .row.top .bar i { background: linear-gradient(90deg, #5b6cff, #9aa6ff); }
  .pct { text-align: right; }
  .err { color: #ff7b7b; }

  @media (max-width: 520px) {
    .stage { height: 360px; }
    .doodle { left: auto; right: 0; top: 0; width: 150px; }
    .doodle .label { font-size: 26px; margin-left: 30px; }
    .row { grid-template-columns: 120px 1fr 40px; }
  }
  /* GitHub corner (tholman/github-corners), links to the source. */
  .gh-corner { position: fixed; top: 0; right: 0; z-index: 10; }
  .gh-corner svg { fill: var(--fg); color: var(--bg); width: 72px; height: 72px; display: block; }
  .gh-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out; }
  @keyframes octocat-wave { 0%,100% { transform: rotate(0) } 20%,60% { transform: rotate(-25deg) } 40%,80% { transform: rotate(10deg) } }
  .cvx-corner { position: fixed; top: 0; left: 0; z-index: 10; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .cvx-corner svg.tri { fill: var(--fg); width: 72px; height: 72px; display: block; }
  .cvx-corner svg.logo { position: absolute; top: 9px; left: 9px; width: 26px; height: 26px; fill: var(--bg); transition: transform .3s; }
  .cvx-corner:hover svg.logo { transform: rotate(-20deg) scale(1.1); }
  /* Playful correction: the 8 is scribbled out and "Jev" is hand-written above it. */
  .fix { position: relative; display: inline-block; margin: 0 0.12em; }
  .old { position: relative; display: inline-block; }
  .old svg { position: absolute; left: 50%; top: 50%; width: 1.1em; height: 0.75em; transform: translate(-50%, -50%); overflow: visible; }
  .old path { fill: none; stroke: var(--doodle); stroke-width: 4; stroke-linecap: round; }
  .new {
    position: absolute; left: 50%; bottom: 82%; transform: translateX(-50%) rotate(-8deg);
    font-family: Caveat, cursive; font-weight: 600; font-size: 1.1em; line-height: 1; color: var(--doodle);
    white-space: nowrap; pointer-events: none;
  }
</style>
</head>
<body>
  <a class="cvx-corner" href="https://convex.dev" target="_blank" rel="noopener" aria-label="Made with Convex" title="Made with Convex">
    <svg class="tri" viewBox="0 0 250 250" aria-hidden="true"><path d="M0,0 L250,0 L0,250 Z"/></svg>
    <svg class="logo" viewBox="0 0 367 370" aria-hidden="true"><g transform="matrix(1,0,0,1,-129.225,-127.948)"><g transform="matrix(4.16667,0,0,4.16667,0,0)"><g transform="matrix(1,0,0,1,86.6099,107.074)"><path d="M0,-6.544C13.098,-7.973 25.449,-14.834 32.255,-26.287C29.037,2.033 -2.48,19.936 -28.196,8.94C-30.569,7.925 -32.605,6.254 -34.008,4.088C-39.789,-4.83 -41.69,-16.18 -38.963,-26.48C-31.158,-13.247 -15.3,-5.131 0,-6.544"/></g><g transform="matrix(1,0,0,1,47.1708,74.7779)"><path d="M0,-2.489C-5.312,9.568 -5.545,23.695 0.971,35.316C-21.946,18.37 -21.692,-17.876 0.689,-34.65C2.754,-36.197 5.219,-37.124 7.797,-37.257C18.41,-37.805 29.19,-33.775 36.747,-26.264C21.384,-26.121 6.427,-16.446 0,-2.489"/></g><g transform="matrix(1,0,0,1,91.325,66.4152)"><path d="M0,-14.199C-7.749,-24.821 -19.884,-32.044 -33.173,-32.264C-7.482,-43.726 24.112,-25.143 27.557,2.322C27.877,4.876 27.458,7.469 26.305,9.769C21.503,19.345 12.602,26.776 2.203,29.527C9.838,15.64 8.889,-1.328 0,-14.199"/></g></g></g></svg>
  </a>
  <a class="gh-corner" href="https://github.com/mikecann/magic-jev-ball" target="_blank" rel="noopener" aria-label="View source on GitHub">
    <svg viewBox="0 0 250 250" aria-hidden="true"><path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"/><path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"/><path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor"/></svg>
  </a>
  <h1 aria-label="Magic Jev Ball">Magic <span class="fix" aria-hidden="true"><span class="old">8<svg viewBox="0 0 60 40"><path d="M4 30 C 18 22, 34 16, 56 8"/><path d="M8 36 C 22 28, 38 22, 56 16"/></svg></span><span class="new">Jev</span></span> Ball</h1>
  <p class="sub">Probably slop</p>

  <form id="form">
    <input id="q" autocomplete="off" placeholder="Ask a yes-or-no question…" autofocus />
  </form>

  <div class="stage" id="stage">
    <div class="doodle" id="doodle" aria-hidden="true">
      <div class="wiggle">
        <div class="label">shake me!</div>
        <svg viewBox="0 0 200 130" width="100%">
          <path d="M150 8 C 165 45, 140 85, 95 100 C 70 108, 45 108, 22 104" />
          <path class="head" d="M40 88 L 20 104 L 42 118" />
        </svg>
      </div>
    </div>
  </div>
  <div class="status">
    <div class="msg" id="msg">Hold the ball, shake it, let go</div>
    <div class="meter" id="meter"><i></i></div>
  </div>

  <div class="panel" id="panel" aria-live="polite"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
